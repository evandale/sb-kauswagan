<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangguniang Bayan of Kauswagan - Official Digital Bulletin Board</title>
<meta name="description" content="Official digital bulletin board of the Sangguniang Bayan of Kauswagan, Lanao del Norte.">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-root="" data-page="home">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<nav id="site-nav" class="site-nav" aria-label="Main navigation"></nav>
<section class="hero">
  <div class="wrap">
    <h1>Welcome to the Official Digital Bulletin Board of the Sangguniang Bayan of Kauswagan, Lanao del Norte.</h1>
    <p>Your online access to official legislative documents, public notices, municipal announcements, and updates from the Sangguniang Bayan.</p>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search by title, number, or keyword" aria-label="Search documents and announcements" autocomplete="off">
      <button id="qClear" type="button">Clear</button>
    </form>
  </div>
</section>
<main id="main" class="wrap home">
  <div class="cats" id="cats"></div>
  <div id="notice" class="notice" role="alert" style="display:none"></div>
  <div class="filters">
    <label>Category <select id="fCat"></select></label>
    <label>Year <select id="fYear"></select></label>
    <button class="reset" id="reset" type="button">Show everything</button>
  </div>
  <div id="out" aria-live="polite"><noscript>Please enable JavaScript to view the documents.</noscript></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/functions.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
